apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
  labels:
    app: backstage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
      annotations:
        backstage.io/kubernetes-id: backstage
        argocd/app-name: backstage
    spec:
      serviceAccountName: backstage
      containers:
        - name: backstage
          image: backstage:local
          imagePullPolicy: Never
          ports:
            - containerPort: 7007
          envFrom:
            - secretRef:
                name: backstage-postgres-credentials
            - secretRef:
                name: backstage-argocd-credentials
            - secretRef:
                name: backstage-backend-credentials
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 7007
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
