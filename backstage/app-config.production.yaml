app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:8080

backend:
  # Port 8080 is forwarded by k3d to the in-cluster LoadBalancer on port 80 → 7007.
  baseUrl: http://localhost:8080
  listen: ':7007'
  csp:
    connect-src: ["'self'"]

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  providers:
    guest:
      dangerouslyAllowOutsideDevelopment: true

proxy:
  endpoints:
    '/argocd/api':
      target: http://argocd-server.argocd.svc.cluster.local/api/v1/
      changeOrigin: true
      headers:
        Cookie: ''

argocd:
  authToken: ${ARGOCD_AUTH_TOKEN}
  appLocatorMethods:
    - type: 'config'
      instances:
        - name: personal-idp
          url: http://argocd-server.argocd.svc.cluster.local

kubernetes:
  frontend:
    podLookupMethod: annotation
  serviceLocatorMethod:
    type: multiTenant
  clusterLocatorMethods:
    - type: config
      clusters:
        - url: https://kubernetes.default.svc
          name: personal-idp
          authProvider: serviceAccount
          skipTLSVerify: true
          skipMetricsLookup: false

# In-cluster Camunda service DNS (backstage ns → camunda ns). Overrides the localhost
# port-forward URLs from app-config.yaml; username/password are inherited from the base config.
# Operate/Tasklist web ports are 80; the Zeebe REST v2 gateway is 8080.
branchline:
  camunda:
    operateBaseUrl: http://camunda-operate.camunda.svc.cluster.local
    tasklistBaseUrl: http://camunda-tasklist.camunda.svc.cluster.local
    zeebeBaseUrl: http://camunda-zeebe-gateway.camunda.svc.cluster.local:8080

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]
